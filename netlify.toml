# Configuración de Netlify para ELECTRO FLOR (Next.js)

[build]
  command = "npm run build"
  publish = ".next"

# Next.js Netlify runtime maneja las rutas de App Router automáticamente.

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

